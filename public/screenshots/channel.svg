<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <defs>
    <style>
      .body { fill: #ffffff; }
      .text-dark { fill: #0a0a0a; font-family: -apple-system, system-ui, sans-serif; }
      .text-muted { fill: #737373; font-family: -apple-system, system-ui, sans-serif; }
      .text-emerald { fill: #047857; font-family: -apple-system, system-ui, sans-serif; }
      .card { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; }
      .me-row { fill: #ecfdf5; }
    </style>
  </defs>

  <rect width="320" height="640" rx="32" class="body"/>

  <!-- status bar -->
  <text x="20" y="22" class="text-dark" font-size="11" font-weight="600">9:41</text>

  <!-- header -->
  <text x="20" y="58" class="text-muted" font-size="11">&#8592; Home</text>
  <text x="20" y="86" class="text-dark" font-size="22" font-weight="700">APG Crew</text>
  <text x="20" y="106" class="text-muted" font-size="11">3 members · Invite code:</text>
  <rect x="155" y="94" width="60" height="16" rx="4" fill="#f5f5f5"/>
  <text x="162" y="106" class="text-dark" font-size="11" font-family="monospace">5A243D</text>
  <text x="20" y="124" class="text-emerald" font-size="11" font-weight="600">You&#8217;re ranked #2 of 3</text>

  <!-- invite button -->
  <rect x="20" y="138" width="120" height="32" rx="16" fill="#10b981"/>
  <text x="80" y="158" fill="white" font-size="12" font-weight="600" text-anchor="middle">Invite friends</text>

  <!-- leaderboard -->
  <rect x="16" y="184" width="288" height="220" rx="16" class="card"/>
  <rect x="16" y="184" width="288" height="36" fill="#fafafa"/>
  <text x="28" y="206" class="text-muted" font-size="10" font-weight="700" letter-spacing="0.5">LEADERBOARD</text>

  <!-- row 1: Maya -->
  <line x1="16" y1="220" x2="304" y2="220" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="244" class="text-dark" font-size="14">&#129351;</text>
  <text x="54" y="246" class="text-dark" font-size="13" font-weight="600">Maya</text>
  <rect x="220" y="232" width="32" height="20" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="236" y="246" class="text-muted" font-size="10" text-anchor="middle">&#128079; 4</text>
  <text x="290" y="246" class="text-dark" font-size="14" font-weight="700" text-anchor="end">91</text>
  <text x="294" y="246" class="text-muted" font-size="11" font-family="-apple-system, system-ui, sans-serif">d</text>

  <!-- row 2: You (highlighted) -->
  <line x1="16" y1="262" x2="304" y2="262" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="16" y="262" width="288" height="46" class="me-row"/>
  <text x="28" y="286" class="text-dark" font-size="14">&#129352;</text>
  <text x="54" y="288" class="text-dark" font-size="13" font-weight="600">tacochimo</text>
  <text x="128" y="288" class="text-emerald" font-size="9" font-weight="700">you</text>
  <text x="290" y="288" class="text-dark" font-size="14" font-weight="700" text-anchor="end">23</text>
  <text x="294" y="288" class="text-muted" font-size="11">d</text>

  <!-- row 3: Sam -->
  <line x1="16" y1="308" x2="304" y2="308" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="332" class="text-dark" font-size="14">&#129353;</text>
  <text x="54" y="334" class="text-dark" font-size="13" font-weight="600">Sam</text>
  <rect x="220" y="320" width="32" height="20" rx="10" fill="#fafafa" stroke="#e5e5e5"/>
  <text x="236" y="334" class="text-muted" font-size="10" text-anchor="middle">&#128079; 1</text>
  <text x="290" y="334" class="text-dark" font-size="14" font-weight="700" text-anchor="end">14</text>
  <text x="294" y="334" class="text-muted" font-size="11">d</text>

  <!-- row 4: Lee (just started) -->
  <line x1="16" y1="350" x2="304" y2="350" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="374" class="text-muted" font-size="11">#4</text>
  <text x="54" y="376" class="text-dark" font-size="13" font-weight="600">Lee</text>
  <text x="54" y="390" class="text-muted" font-size="9">restarting&#8230;</text>
  <text x="290" y="376" class="text-dark" font-size="14" font-weight="700" text-anchor="end">0</text>
  <text x="294" y="376" class="text-muted" font-size="11">d</text>

  <!-- activity feed -->
  <rect x="16" y="420" width="288" height="200" rx="16" class="card"/>
  <rect x="16" y="420" width="288" height="36" fill="#fafafa"/>
  <text x="28" y="442" class="text-muted" font-size="10" font-weight="700" letter-spacing="0.5">ACTIVITY</text>

  <line x1="16" y1="456" x2="304" y2="456" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="478" class="text-dark" font-size="11">Maya hit 90 days &#11088;</text>
  <text x="294" y="478" class="text-muted" font-size="10" text-anchor="end">2h ago</text>

  <line x1="16" y1="492" x2="304" y2="492" stroke="#e5e5e5" stroke-width="1"/>
  <rect x="16" y="492" width="288" height="32" fill="#fffbeb"/>
  <text x="28" y="514" class="text-dark" font-size="11" font-weight="600">&#128680; Sam: &#8220;rough morning&#8221;</text>
  <text x="294" y="514" class="text-muted" font-size="10" text-anchor="end">3h ago</text>

  <line x1="16" y1="524" x2="304" y2="524" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="546" class="text-dark" font-size="11">tacochimo started a streak</text>
  <text x="294" y="546" class="text-muted" font-size="10" text-anchor="end">1d ago</text>

  <line x1="16" y1="560" x2="304" y2="560" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="582" class="text-dark" font-size="11">Lee joined</text>
  <text x="294" y="582" class="text-muted" font-size="10" text-anchor="end">3d ago</text>

  <line x1="16" y1="596" x2="304" y2="596" stroke="#e5e5e5" stroke-width="1"/>
  <text x="28" y="616" class="text-dark" font-size="11">Sam hit 7 days &#11088;</text>
  <text x="294" y="616" class="text-muted" font-size="10" text-anchor="end">7d ago</text>
</svg>
