<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" width="320" height="640">
  <defs>
    <style>
      .body { fill: #ffffff; }
      .text-dark { fill: #0a0a0a; font-family: -apple-system, system-ui, sans-serif; }
      .text-muted { fill: #737373; font-family: -apple-system, system-ui, sans-serif; }
      .user-bubble { fill: #10b981; }
      .asst-bubble { fill: #ffffff; stroke: #e5e5e5; stroke-width: 1; }
      .chat-bg { fill: #fafafa; stroke: #e5e5e5; stroke-width: 1; }
    </style>
  </defs>

  <rect width="320" height="640" rx="32" class="body"/>

  <!-- status bar -->
  <text x="20" y="22" class="text-dark" font-size="11" font-weight="600">9:41</text>

  <!-- header -->
  <text x="20" y="58" class="text-muted" font-size="11">&#8592; Home</text>
  <text x="20" y="86" class="text-dark" font-size="22" font-weight="700">Coach</text>

  <!-- chat container -->
  <rect x="16" y="104" width="288" height="450" rx="16" class="chat-bg"/>

  <!-- assistant bubble 1 -->
  <rect x="28" y="118" width="220" height="48" rx="16" class="asst-bubble"/>
  <text x="40" y="138" class="text-dark" font-size="11">Hey, just thinking of you.</text>
  <text x="40" y="154" class="text-dark" font-size="11">How are the cravings today?</text>

  <!-- user bubble 1 -->
  <rect x="92" y="178" width="200" height="50" rx="16" class="user-bubble"/>
  <text x="104" y="200" fill="white" font-size="11">Honestly rough. Had a fight</text>
  <text x="104" y="216" fill="white" font-size="11">with my brother and I want one.</text>

  <!-- assistant bubble 2 -->
  <rect x="28" y="240" width="252" height="80" rx="16" class="asst-bubble"/>
  <text x="40" y="260" class="text-dark" font-size="11">Yeah, that&#8217;s a hard moment. The</text>
  <text x="40" y="276" class="text-dark" font-size="11">urge usually peaks in under 5 min.</text>
  <text x="40" y="296" class="text-dark" font-size="11">Want to try a 4-4-4-4 breath?</text>
  <text x="40" y="310" fill="#10b981" font-size="11" font-weight="600">/app/breathe</text>

  <!-- user bubble 2 -->
  <rect x="148" y="332" width="144" height="32" rx="16" class="user-bubble"/>
  <text x="160" y="352" fill="white" font-size="11">ok, doing it now</text>

  <!-- assistant bubble streaming -->
  <rect x="28" y="376" width="240" height="64" rx="16" class="asst-bubble"/>
  <text x="40" y="396" class="text-dark" font-size="11">Good. Remember &#8220;for my kids.&#8221;</text>
  <text x="40" y="412" class="text-dark" font-size="11">In 5 min you&#8217;ll be on the other</text>
  <text x="40" y="428" class="text-dark" font-size="11">side of it and proud you didn&#8217;t<tspan fill="#737373">|</tspan></text>

  <!-- quick prompts (faded — chat is in progress) -->
  <rect x="28" y="568" width="276" height="44" rx="22" fill="white" stroke="#e5e5e5"/>
  <text x="44" y="595" class="text-muted" font-size="12">Type a message…</text>
  <rect x="248" y="572" width="48" height="36" rx="18" fill="#10b981"/>
  <text x="272" y="594" fill="white" font-size="11" font-weight="600" text-anchor="middle">Send</text>
</svg>
